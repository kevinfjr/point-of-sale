<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen POS — Firebase Connected</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden">

    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 1. INISIALISASI FIREBASE (Kofigurasi Anda)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBsn2hxQVtZ7zibEddi6XYCi6ZGARttUJk",
            authDomain: "point-of-sale-fd99a.firebaseapp.com",
            databaseURL: "https://point-of-sale-fd99a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "point-of-sale-fd99a",
            storageBucket: "point-of-sale-fd99a.firebasestorage.app",
            messagingSenderId: "265598617841",
            appId: "1:265598617841:web:0d00b087cf98f687ef4150",
            measurementId: "G-004CZ9S41Y"
        };
        
        // Mencegah inisialisasi ganda
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ==========================================
        // 2. KOMPONEN ICON (ANTI-CRASH)
        // ==========================================
        const Icon = ({ name, className }) => {
            if (!window.lucide || !window.lucide.icons[name]) return null;
            const svgContent = window.lucide.icons[name].toSvg({ class: className });
            return <i className="inline-flex items-center justify-center" dangerouslySetInnerHTML={{ __html: svgContent }} />;
        };

        const { useState, useEffect } = React;

        // --- DATA PRODUK & PELANGGAN LOKAL ---
        const initialProducts = [
            { id: 1, name: 'Espresso Single', category: 'Beverage', sku: 'BVR-001', price: 22000, stock: 120, color: 'bg-orange-300', rank: '#1' },
            { id: 2, name: 'Cappuccino', category: 'Beverage', sku: 'BVR-002', price: 32000, stock: 85, color: 'bg-pink-300', rank: '#2' },
            { id: 3, name: 'Caramel Latte', category: 'Beverage', sku: 'BVR-003', price: 38000, stock: 64, color: 'bg-teal-300', rank: '#3' },
            { id: 4, name: 'Matcha Latte', category: 'Beverage', sku: 'BVR-004', price: 40000, stock: 52, color: 'bg-blue-300', rank: '#4' },
            { id: 5, name: 'Iced Americano', category: 'Beverage', sku: 'BVR-005', price: 28000, stock: 110, color: 'bg-purple-300', rank: '#5' },
            { id: 6, name: 'Butter Croissant', category: 'Bakery', sku: 'BKR-001', price: 25000, stock: 40, color: 'bg-green-300' },
            { id: 7, name: 'Almond Danish', category: 'Bakery', sku: 'BKR-002', price: 28000, stock: 32, color: 'bg-yellow-400' },
            { id: 8, name: 'Chocolate Muffin', category: 'Bakery', sku: 'BKR-003', price: 24000, stock: 48, color: 'bg-sky-300' }
        ];

        const initialCustomers = [
            { initials: 'AW', name: 'Andra Wijaya', since: '12 Jan 2024', email: 'andra@mail.com', phone: '0812-3456-7890', total: 4250000, txCount: 28 },
            { initials: 'SP', name: 'Sinta Putri', since: '03 Feb 2024', email: 'sinta@mail.com', phone: '0813-9988-1122', total: 2980000, txCount: 19 },
            { initials: 'BH', name: 'Bagus Hartono', since: '22 Nov 2023', email: 'bagus@mail.com', phone: '0821-7766-5544', total: 6720000, txCount: 41 },
            { initials: 'ML', name: 'Maya Lestari', since: '18 Mei 2024', email: 'maya@mail.com', phone: '0857-2233-4455', total: 1540000, txCount: 12 },
            { initials: 'RP', name: 'Reza Pratama', since: '04 Agu 2023', email: 'reza@mail.com', phone: '0811-3344-9988', total: 8910000, txCount: 53 },
            { initials: 'DA', name: 'Dewi Anggraeni', since: '29 Mar 2024', email: 'dewi@mail.com', phone: '0852-1122-3344', total: 3320000, txCount: 22 }
        ];

        const formatRupiah = (num) => 'Rp ' + num.toLocaleString('id-ID').replace(/,/g, '.');

        // --- COMPONENTS ---

        function Sidebar({ activeTab, setActiveTab }) {
            const menuItems = [
                { id: 'dashboard', name: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'pos', name: 'Kasir POS', icon: 'scan' },
                { id: 'products', name: 'Produk', icon: 'box' },
                { id: 'transactions', name: 'Transaksi', icon: 'receipt' },
                { id: 'customers', name: 'Pelanggan', icon: 'users' },
                { id: 'analytics', name: 'Statistik', icon: 'bar-chart-2' }
            ];

            return (
                <div className="w-64 bg-white border-r border-slate-200 h-screen flex flex-col flex-shrink-0 relative z-20 shadow-sm">
                    <div className="p-6">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 text-white p-1.5 rounded-lg">
                                <Icon name="sparkles" className="w-5 h-5" />
                            </div>
                            <div>
                                <h1 className="text-base font-bold text-slate-800 leading-tight">Lumen POS</h1>
                                <p className="text-[11px] text-emerald-500 font-bold flex items-center gap-1 mt-0.5">
                                    <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Firebase Active
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <div className="px-4 mb-2">
                        <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider ml-2">Menu</p>
                    </div>

                    <nav className="flex-1 px-3 space-y-1">
                        {menuItems.map((item) => (
                            <button
                                key={item.id}
                                onClick={() => setActiveTab(item.id)}
                                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                                    activeTab === item.id 
                                        ? 'bg-blue-50 text-blue-600' 
                                        : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                                }`}
                            >
                                <Icon name={item.icon} className="w-4 h-4" />
                                {item.name}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        function TopBar({ dbStatus }) {
            return (
                <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0 relative z-10">
                    <div className="flex items-center gap-2 text-slate-400 border border-slate-200 rounded-lg px-3 py-2 w-96 bg-slate-50">
                        <Icon name="search" className="w-4 h-4" />
                        <input type="text" placeholder="Cari..." className="bg-transparent border-none outline-none text-sm w-full text-slate-700" />
                    </div>
                    <div className="flex items-center gap-4 text-slate-500">
                        <div className={`px-3 py-1.5 rounded-full text-[11px] font-bold border flex items-center gap-1.5 transition-colors ${dbStatus ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-amber-50 text-amber-600 border-amber-200'}`}>
                            <Icon name={dbStatus ? 'wifi' : 'wifi-off'} className="w-3.5 h-3.5" />
                            {dbStatus ? 'Connected to DB' : 'Connecting...'}
                        </div>
                        <button className="hover:text-slate-800"><Icon name="moon" className="w-5 h-5" /></button>
                        <button className="hover:text-slate-800 relative">
                            <Icon name="bell" className="w-5 h-5" />
                            <span className="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        <div className="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold ml-2">AD</div>
                    </div>
                </header>
            );
        }

        function POS({ onCheckout }) {
            const [cart, setCart] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [activeCategory, setActiveCategory] = useState('Semua');
            const categories = ['Semua', 'Beverage', 'Bakery', 'Food'];

            const filteredProducts = initialProducts.filter(p => {
                const matchCategory = activeCategory === 'Semua' || p.category === activeCategory;
                const matchSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
                return matchCategory && matchSearch;
            });

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const updateQty = (id, change) => {
                setCart(prev => prev.map(item => item.id === id ? { ...item, qty: Math.max(0, item.qty + change) } : item).filter(item => item.qty > 0));
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));

            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const tax = subtotal * 0.11;
            const total = subtotal + tax;

            const handlePay = () => {
                if (cart.length === 0) return;
                onCheckout(total);
                setCart([]);
                setSearchTerm('');
            };

            return (
                <div className="flex gap-6 h-full max-h-full">
                    <div className="flex-1 flex flex-col h-full bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                        <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 mb-4 focus-within:border-blue-400">
                            <Icon name="scan-barcode" className="w-4 h-4 text-slate-400" />
                            <input type="text" placeholder="Ketik nama produk..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="bg-transparent outline-none text-sm w-full text-slate-700" />
                        </div>
                        
                        <div className="flex gap-2 mb-4">
                            {categories.map((cat) => (
                                <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${activeCategory === cat ? 'bg-slate-800 text-white shadow' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`}>{cat}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 overflow-y-auto pr-2 pb-4">
                            {filteredProducts.map((product) => (
                                <div key={product.id} onClick={() => addToCart(product)} className="border border-slate-100 rounded-2xl overflow-hidden cursor-pointer hover:shadow-md hover:border-blue-400 transition-all bg-white flex flex-col">
                                    <div className={`h-28 relative ${product.color}`}>
                                        <div className="absolute top-2 left-2 bg-white/90 backdrop-blur-sm text-slate-600 text-[10px] font-semibold px-2 py-0.5 rounded-full">Stok {product.stock}</div>
                                    </div>
                                    <div className="p-3">
                                        <p className="text-[10px] text-slate-400">{product.category}</p>
                                        <h4 className="font-medium text-slate-800 text-sm mt-0.5 mb-1 truncate">{product.name}</h4>
                                        <p className="text-sm font-semibold text-slate-800">{formatRupiah(product.price)}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="w-80 flex flex-col bg-white rounded-2xl border border-slate-200 shadow-sm flex-shrink-0 relative">
                        <div className="p-4 border-b border-slate-100 flex justify-between items-center">
                            <h3 className="font-semibold text-slate-800">Keranjang</h3>
                            <span className="bg-blue-100 text-blue-600 text-xs font-bold px-2 py-1 rounded-full">{cart.length} item</span>
                        </div>
                        
                        <div className="flex-1 flex flex-col p-4 overflow-y-auto">
                            {cart.length === 0 ? (
                                <div className="text-center my-auto">
                                    <Icon name="receipt" className="w-12 h-12 mx-auto text-slate-200 mb-3" />
                                    <p className="text-sm text-slate-400">Belum ada item.<br/>Pilih produk untuk memulai.</p>
                                </div>
                            ) : (
                                <div className="space-y-3 w-full">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex justify-between items-center border-b border-slate-50 pb-3">
                                            <div className="flex-1 min-w-0 pr-2">
                                                <h4 className="font-semibold text-sm text-slate-800 truncate">{item.name}</h4>
                                                <p className="text-blue-600 text-sm font-medium mt-0.5">{formatRupiah(item.price)}</p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="flex items-center bg-slate-50 rounded-lg border border-slate-200">
                                                    <button onClick={() => updateQty(item.id, -1)} className="px-2 py-1 text-slate-500 hover:bg-slate-200 rounded-l-lg font-bold">-</button>
                                                    <span className="px-2 text-xs font-bold text-slate-800">{item.qty}</span>
                                                    <button onClick={() => updateQty(item.id, 1)} className="px-2 py-1 text-slate-500 hover:bg-slate-200 rounded-r-lg font-bold">+</button>
                                                </div>
                                                <button onClick={() => removeFromCart(item.id)} className="text-red-400 hover:bg-red-50 p-1.5 rounded-lg"><Icon name="trash-2" className="w-4 h-4" /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="p-4 bg-slate-50 rounded-b-2xl border-t border-slate-100 mt-auto">
                            <div className="flex justify-between text-sm text-slate-500 mb-1"><span>Subtotal</span><span>{formatRupiah(subtotal)}</span></div>
                            <div className="flex justify-between text-sm text-slate-500 mb-2"><span>Pajak (11%)</span><span>{formatRupiah(tax)}</span></div>
                            <div className="flex justify-between text-base font-bold text-slate-800 pt-2 pb-4 border-t border-slate-200/60 mt-2">
                                <span>Total Akhir</span><span className="text-blue-600">{formatRupiah(total)}</span>
                            </div>
                            <button onClick={handlePay} disabled={cart.length === 0} className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-bold py-3 rounded-xl transition-colors flex justify-between px-4 items-center shadow-md shadow-blue-600/20">
                                <span>Checkout Bayar</span><span>{formatRupiah(total)}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Halaman Produk (Full UI)
        function Products() {
            return (
                <div className="max-w-6xl mx-auto flex flex-col h-full space-y-6">
                    <div className="flex justify-between items-end">
                        <div>
                            <h2 className="text-2xl font-semibold tracking-tight text-slate-800">Produk</h2>
                            <p className="text-sm text-slate-500 mt-1">16 produk aktif di katalog</p>
                        </div>
                        <button className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                            <Icon name="plus" className="w-4 h-4" /> Tambah Produk
                        </button>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col flex-1 overflow-hidden">
                        <div className="p-4 border-b border-slate-100 flex gap-4">
                            <div className="flex items-center gap-2 border border-slate-200 rounded-lg px-3 py-2 flex-1 focus-within:border-blue-400">
                                <Icon name="search" className="w-4 h-4 text-slate-400" />
                                <input type="text" placeholder="Cari nama atau SKU..." className="text-sm outline-none w-full text-slate-700" />
                            </div>
                            <div className="border border-slate-200 rounded-lg px-3 py-2 flex items-center justify-between w-48 text-sm text-slate-600 cursor-pointer">
                                <span>Semua kategori</span>
                                <Icon name="chevron-down" className="w-4 h-4" />
                            </div>
                        </div>
                        
                        <div className="overflow-y-auto flex-1">
                            <table className="w-full text-left">
                                <thead className="bg-slate-50/50 sticky top-0 z-10 border-b border-slate-100">
                                    <tr className="text-xs text-slate-500 font-medium">
                                        <th className="px-6 py-4 font-medium">Produk</th>
                                        <th className="px-6 py-4 font-medium text-center">Kategori</th>
                                        <th className="px-6 py-4 font-medium">SKU</th>
                                        <th className="px-6 py-4 font-medium text-right">Harga</th>
                                        <th className="px-6 py-4 font-medium text-right">Stok</th>
                                        <th className="px-6 py-4 font-medium text-right w-16"></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                                    {initialProducts.map((p) => (
                                        <tr key={p.id} className="hover:bg-slate-50/50 transition-colors group">
                                            <td className="px-6 py-3">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-lg ${p.color}`}></div>
                                                    <span className="font-medium text-slate-800">{p.name}</span>
                                                </div>
                                            </td>
                                            <td className="px-6 py-3 text-center">
                                                <span className="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-md font-medium">{p.category}</span>
                                            </td>
                                            <td className="px-6 py-3 text-slate-500 text-xs">{p.sku}</td>
                                            <td className="px-6 py-3 text-right font-medium text-slate-800">{formatRupiah(p.price)}</td>
                                            <td className="px-6 py-3 text-right text-slate-600">{p.stock}</td>
                                            <td className="px-6 py-3 text-right">
                                                <button className="text-slate-400 hover:text-slate-800"><Icon name="more-horizontal" className="w-4 h-4" /></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // Halaman Pelanggan (Full UI)
        function Customers() {
            return (
                <div className="max-w-6xl mx-auto flex flex-col h-full space-y-6 overflow-y-auto pb-8">
                    <div className="flex justify-between items-end">
                        <div>
                            <h2 className="text-2xl font-semibold tracking-tight text-slate-800">Pelanggan</h2>
                            <p className="text-sm text-slate-500 mt-1">Daftar pelanggan terdaftar</p>
                        </div>
                        <button className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                            <Icon name="plus" className="w-4 h-4" /> Pelanggan Baru
                        </button>
                    </div>

                    <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-lg px-4 py-2.5 w-full md:w-96 focus-within:border-blue-400">
                        <Icon name="search" className="w-4 h-4 text-slate-400" />
                        <input type="text" placeholder="Cari nama atau email..." className="text-sm outline-none w-full text-slate-700" />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {initialCustomers.map((cust, i) => (
                            <div key={i} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:border-blue-200 transition-colors relative">
                                <div className="absolute top-5 right-5 bg-slate-50 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-100">
                                    {cust.txCount}x
                                </div>
                                <div className="flex items-center gap-4 mb-4">
                                    <div className="w-12 h-12 rounded-full bg-blue-50 text-blue-600 font-bold flex items-center justify-center text-sm border border-blue-100">
                                        {cust.initials}
                                    </div>
                                    <div>
                                        <h4 className="font-semibold text-slate-800 text-sm">{cust.name}</h4>
                                        <p className="text-[11px] text-slate-500">Sejak {cust.since}</p>
                                    </div>
                                </div>
                                <div className="space-y-2 mb-4">
                                    <div className="flex items-center gap-2 text-slate-500 text-xs">
                                        <Icon name="mail" className="w-3.5 h-3.5" /> {cust.email}
                                    </div>
                                    <div className="flex items-center gap-2 text-slate-500 text-xs">
                                        <Icon name="phone" className="w-3.5 h-3.5" /> {cust.phone}
                                    </div>
                                </div>
                                <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                                    <span className="text-[11px] text-slate-400 font-medium">Total belanja</span>
                                    <span className="text-sm font-bold text-slate-800">{formatRupiah(cust.total)}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Halaman Statistik (Full UI)
        function Analytics() {
            return (
                <div className="max-w-6xl mx-auto space-y-6 overflow-y-auto pb-8 h-full">
                    <div>
                        <h2 className="text-2xl font-semibold tracking-tight text-slate-800">Statistik Penjualan</h2>
                        <p className="text-sm text-slate-500 mt-1">Insight performa toko Anda</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-sm font-medium text-slate-500">Pendapatan</p>
                                <div className="p-1.5 bg-blue-50 text-blue-500 rounded-lg"><Icon name="trending-up" className="w-4 h-4" /></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-800 mt-3">{formatRupiah(2584080)}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-sm font-medium text-slate-500">Order Selesai</p>
                                <div className="p-1.5 bg-blue-50 text-blue-500 rounded-lg"><Icon name="shopping-bag" className="w-4 h-4" /></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-800 mt-3">15</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-sm font-medium text-slate-500">Rata-rata Order</p>
                                <div className="p-1.5 bg-blue-50 text-blue-500 rounded-lg"><Icon name="percent" className="w-4 h-4" /></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-800 mt-3">{formatRupiah(172272)}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-sm font-medium text-slate-500">Pelanggan Unik</p>
                                <div className="p-1.5 bg-blue-50 text-blue-500 rounded-lg"><Icon name="users" className="w-4 h-4" /></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-800 mt-3">8</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                            <h3 className="text-base font-semibold text-slate-800 mb-6">Tren Penjualan Mingguan</h3>
                            <div className="flex-1 flex flex-col justify-end min-h-[250px]">
                                <div className="flex justify-between text-xs text-slate-500 mt-4 border-t border-slate-100 pt-3 px-2 font-medium">
                                    <div className="text-center"><span>Sen</span><br/><span className="text-slate-800">4.2M</span></div>
                                    <div className="text-center"><span>Sel</span><br/><span className="text-slate-800">5.1M</span></div>
                                    <div className="text-center"><span>Rab</span><br/><span className="text-slate-800">4.8M</span></div>
                                    <div className="text-center"><span>Kam</span><br/><span className="text-slate-800">6.2M</span></div>
                                    <div className="text-center"><span>Jum</span><br/><span className="text-slate-800">7.4M</span></div>
                                    <div className="text-center"><span>Sab</span><br/><span className="text-slate-800">9.1M</span></div>
                                    <div className="text-center"><span>Min</span><br/><span className="text-slate-800">8.2M</span></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h3 className="text-base font-semibold text-slate-800 mb-6">Per Kategori</h3>
                            <div className="space-y-6">
                                <div>
                                    <div className="flex justify-between text-xs font-semibold text-slate-800 mb-2"><span>Beverage</span><span className="text-slate-500">25%</span></div>
                                    <div className="w-full bg-slate-100 rounded-full h-1.5"><div className="bg-blue-600 h-1.5 rounded-full w-1/4"></div></div>
                                </div>
                                <div>
                                    <div className="flex justify-between text-xs font-semibold text-slate-800 mb-2"><span>Bakery</span><span className="text-slate-500">26%</span></div>
                                    <div className="w-full bg-slate-100 rounded-full h-1.5"><div className="bg-blue-600 h-1.5 rounded-full w-[26%]"></div></div>
                                </div>
                                <div>
                                    <div className="flex justify-between text-xs font-semibold text-slate-800 mb-2"><span>Food</span><span className="text-slate-500">45%</span></div>
                                    <div className="w-full bg-slate-100 rounded-full h-1.5"><div className="bg-blue-600 h-1.5 rounded-full w-[45%]"></div></div>
                                </div>
                                <div>
                                    <div className="flex justify-between text-xs font-semibold text-slate-800 mb-2"><span>Dessert</span><span className="text-slate-500">4%</span></div>
                                    <div className="w-full bg-slate-100 rounded-full h-1.5"><div className="bg-blue-600 h-1.5 rounded-full w-[4%]"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Halaman Dashboard
        function Dashboard({ setActiveTab, transactions }) {
            const totalRevenue = transactions.reduce((acc, tx) => acc + tx.total, 0);

            return (
                <div className="max-w-6xl mx-auto space-y-6">
                    <div className="flex justify-between items-end">
                        <div>
                            <h2 className="text-2xl font-semibold tracking-tight text-slate-800">Dashboard</h2>
                            <p className="text-sm text-slate-500 mt-1">Statistik tersinkronisasi Firebase Database.</p>
                        </div>
                        <button onClick={() => setActiveTab('pos')} className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm transition-colors">
                            <Icon name="scan" className="w-4 h-4" /> Buka Kasir
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-sm font-medium text-slate-500">Pendapatan Cloud</p>
                                <div className="p-1.5 bg-blue-50 text-blue-500 rounded-lg"><Icon name="cloud" className="w-4 h-4" /></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-800 mt-2">{formatRupiah(totalRevenue)}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-sm font-medium text-slate-500">Total Transaksi</p>
                                <div className="p-1.5 bg-blue-50 text-blue-500 rounded-lg"><Icon name="shopping-cart" className="w-4 h-4" /></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-800 mt-2">{transactions.length}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-sm font-medium text-slate-500">Pelanggan Aktif</p>
                                <div className="p-1.5 bg-blue-50 text-blue-500 rounded-lg"><Icon name="users" className="w-4 h-4" /></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-800 mt-2">8</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-sm font-medium text-slate-500">Produk Katalog</p>
                                <div className="p-1.5 bg-blue-50 text-blue-500 rounded-lg"><Icon name="trending-up" className="w-4 h-4" /></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-800 mt-2">16</p>
                        </div>
                    </div>
                </div>
            );
        }

        // Halaman Transaksi (Tersambung Firebase)
        function Transactions({ transactions, isLoading }) {
            return (
                <div className="max-w-6xl mx-auto flex flex-col h-full space-y-6">
                    <div className="flex justify-between items-end">
                        <div>
                            <h2 className="text-2xl font-semibold tracking-tight text-slate-800">Riwayat Transaksi</h2>
                            <p className="text-sm text-slate-500 mt-1">Data ditarik real-time dari Firebase Database.</p>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col flex-1 overflow-hidden">
                        <div className="overflow-y-auto flex-1">
                            {isLoading ? (
                                <div className="flex flex-col items-center justify-center h-full text-slate-400 p-10">
                                    <Icon name="loader-2" className="w-8 h-8 animate-spin mb-4 text-blue-500" />
                                    <p className="text-sm">Menghubungkan ke Database Cloud...</p>
                                </div>
                            ) : (
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50/50 sticky top-0 z-10 border-b border-slate-100">
                                        <tr className="text-xs text-slate-500 font-medium">
                                            <th className="px-6 py-4 font-medium">Invoice</th>
                                            <th className="px-6 py-4 font-medium">Pelanggan</th>
                                            <th className="px-6 py-4 font-medium">Waktu (Real-time)</th>
                                            <th className="px-6 py-4 font-medium text-center">Metode</th>
                                            <th className="px-6 py-4 font-medium">Status</th>
                                            <th className="px-6 py-4 font-medium text-right">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                                        {transactions.length === 0 ? (
                                            <tr><td colSpan="6" className="text-center py-10 text-slate-400">Belum ada transaksi tersimpan di database.</td></tr>
                                        ) : transactions.map((tx) => (
                                            <tr key={tx.id} className="hover:bg-slate-50/50 transition-colors">
                                                <td className="px-6 py-4 text-blue-600 text-xs font-bold">{tx.invoice}</td>
                                                <td className="px-6 py-4 font-medium text-slate-800">{tx.customer}</td>
                                                <td className="px-6 py-4 text-slate-500 text-xs">{tx.date}</td>
                                                <td className="px-6 py-4 text-center">
                                                    <span className="border border-slate-200 text-slate-600 text-[10px] font-bold px-2 py-1 rounded uppercase">{tx.payment}</span>
                                                </td>
                                                <td className="px-6 py-4">
                                                    <span className="bg-emerald-100 text-emerald-700 text-[11px] font-semibold px-2.5 py-1 rounded-full">{tx.status}</span>
                                                </td>
                                                <td className="px-6 py-4 text-right font-bold text-slate-800">{formatRupiah(tx.total)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- ROOT APP (FIREBASE LOGIC) ---
        function App() {
            const [activeTab, setActiveTab] = useState('pos');
            const [transactions, setTransactions] = useState([]);
            const [dbStatus, setDbStatus] = useState(false);
            const [isLoading, setIsLoading] = useState(true);

            // Fetch data transaksi dari Firebase saat app dijalankan
            useEffect(() => {
                const txRef = db.ref('transactions');
                
                // Listener realtime Firebase
                txRef.on('value', (snapshot) => {
                    setDbStatus(true);
                    setIsLoading(false);
                    const data = snapshot.val();
                    if (data) {
                        // Ubah Object Firebase menjadi Array lalu urutkan (Terbaru di atas)
                        const txArray = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        })).sort((a, b) => b.timestamp - a.timestamp);
                        setTransactions(txArray);
                    } else {
                        setTransactions([]);
                    }
                }, (error) => {
                    console.error("Firebase Connect Failed:", error);
                    setDbStatus(false);
                    setIsLoading(false);
                });

                // Cleanup listener ketika aplikasi ditutup
                return () => txRef.off();
            }, []);

            // Simpan Transaksi Baru ke Firebase saat Checkout
            const handleAddTransaction = (totalBayar) => {
                const now = new Date();
                const formattedDate = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                
                const newTx = {
                    customer: 'Walk-in Customer',
                    invoice: `INV-${now.getFullYear()}${Math.floor(1000 + Math.random() * 9000)}`,
                    date: formattedDate,
                    payment: 'CASH',
                    status: 'Completed',
                    total: totalBayar,
                    timestamp: Date.now() // Timestamp untuk sorting
                };
                
                // PUSH KE FIREBASE DATABASE
                db.ref('transactions').push(newTx)
                    .then(() => alert("Struk transaksi berhasil diunggah ke Firebase Cloud Database!"))
                    .catch(err => alert("Gagal menyimpan ke Firebase: " + err.message));
            };

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <TopBar dbStatus={dbStatus} />
                        <main className="flex-1 overflow-y-auto p-6 md:p-8 relative">
                            {activeTab === 'dashboard' && <Dashboard setActiveTab={setActiveTab} transactions={transactions} />}
                            {activeTab === 'pos' && <POS onCheckout={handleAddTransaction} />}
                            {activeTab === 'products' && <Products />}
                            {activeTab === 'transactions' && <Transactions transactions={transactions} isLoading={isLoading} />}
                            {activeTab === 'customers' && <Customers />}
                            {activeTab === 'analytics' && <Analytics />}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
